<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Fruits Records — Finance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .sidebar-link { transition: background 0.15s, color 0.15s; }
    .sidebar-link:hover { background: rgba(255,255,255,0.08); }
    .sidebar-link.active { background: #d97706; color: #fff; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-60 bg-gray-900 text-white flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-gray-700/60">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center font-bold text-white text-xs tracking-tight">FFR</div>
        <div>
          <div class="font-semibold text-sm leading-tight">First Fruits</div>
          <div class="text-gray-400 text-xs">Records</div>
        </div>
      </div>
      <div class="mt-3 text-xs text-gray-500">Finance Dashboard · FY 2025</div>
    </div>

    <nav class="flex-1 p-3 space-y-0.5">
      <a href="#overview" data-page="overview"
         class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400">
        <svg class="w-4.5 h-4.5 shrink-0" style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Overview
      </a>
      <a href="#revenue" data-page="revenue"
         class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400">
        <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Revenue
      </a>
      <a href="#expenses" data-page="expenses"
         class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400">
        <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        </svg>
        Expenses
      </a>
      <a href="#subscriptions" data-page="subscriptions"
         class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400">
        <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Subscriptions
      </a>
    </nav>

    <div class="p-4 border-t border-gray-700/60">
      <div class="text-xs text-gray-500 mb-1 font-medium">Add a new month:</div>
      <div class="text-xs text-gray-600">Edit <code class="bg-gray-800 px-1 rounded text-amber-400">src/data.js</code> and follow the comments at the top.</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between flex-shrink-0">
      <div>
        <h1 id="page-title" class="text-lg font-semibold text-gray-900">Overview</h1>
        <p id="page-subtitle" class="text-xs text-gray-400 mt-0.5">Fiscal Year 2025 · All figures in USD</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-gray-400">Last updated: May 8, 2025</span>
        <div class="w-8 h-8 bg-amber-500 rounded-full flex items-center justify-center text-white text-xs font-bold">FM</div>
      </div>
    </header>

    <main id="content" class="flex-1 overflow-y-auto p-7"></main>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
